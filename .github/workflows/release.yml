name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm run check:packages
      - run: pnpm run check:size
      - run: pnpm run check:tarballs

      - name: Create release pull request or publish
        uses: changesets/action@v1.9.0
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Attaches build provenance to each published package (npm >=9.5,
          # requires the id-token: write permission above and OIDC-enabled
          # trusted publishing on the npm side).
          NPM_CONFIG_PROVENANCE: "true"
