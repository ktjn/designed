name: Chromatic

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  chromatic:
    runs-on: ubuntu-latest
    # Requires a CHROMATIC_PROJECT_TOKEN repository secret from a Chromatic
    # project (https://www.chromatic.com). The publish step is skipped
    # cleanly when the secret is absent, so this workflow doesn't fail
    # before the project is set up. Checking the secret through an env var
    # (rather than referencing `secrets` directly in a step `if:`) avoids a
    # GitHub Actions schema-validation failure that otherwise fails the
    # whole workflow before any step runs.
    env:
      HAS_CHROMATIC_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build order matters: packages/react imports packages/icons at the
      # source level (Dialog/Select use CloseIcon/ChevronDownIcon), so icons
      # must be built before react, not just tokens before react.
      - run: pnpm --filter @ktjn/design-tokens --filter @ktjn/design-icons --filter @ktjn/design-react run build
      - name: Publish to Chromatic
        if: ${{ env.HAS_CHROMATIC_TOKEN == 'true' }}
        uses: chromaui/action@v1
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        with:
          workingDir: apps/storybook
          buildScriptName: build
          exitZeroOnChanges: true
