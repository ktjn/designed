name: Bug Report
description: Report an accessibility, styling, token, or component bug
labels: ["bug"]
body:
  - type: dropdown
    id: package
    attributes:
      label: Affected package
      options:
        - "@ktjn/designed-react"
        - "@ktjn/designed-tokens"
        - "@ktjn/designed-icons"
        - Storybook / Docs
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: e.g. 0.5.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug, including theme attributes (brand, color-scheme, density, contrast) if relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Code snippet, Storybook story, or link to a reproduction repository.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Browser, OS, React version, bundler (e.g. Vite 8)"
